<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AsterA · Rozliczenia SPA · Thai Maliwan</title>
<style>
  :root{
    --ink:#3E4457; --muted:#8B90A3;
    --sky:#8FBFDE; --sky-soft:#DCEBF5; --sky-d:#5f96bd;
    --rose:#E9A6BC; --rose-soft:#F8DEE7; --rose-d:#d3809b;
    --mint:#9BD1B6; --mint-soft:#DEF0E8; --mint-d:#6bb591;
    --gold:#D8B45C; --gold-l:#EAD59A; --gold-d:#b8933f;
    --glass:rgba(255,255,255,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{min-height:100%;background:#1e6fa0}
  /* --- DOTYK / iPad: bez zaznaczania tekstu i bez gestow przegladarki na kolach --- */
  .dial,.wheel,.node,.core,.ring,.rim,.rim2,.face,.dialbox{touch-action:none}
  .dial,.wheel,.node,.core,.spatitle,.legend{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{-webkit-tap-highlight-color:transparent}
  input,textarea,select{-webkit-user-select:text;user-select:text}
  body{font-family:"Segoe UI","Leelawadee UI","Noto Sans Thai",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:12px 12px 40px;overflow-x:hidden;
    background:radial-gradient(900px 720px at 16% 26%,rgba(94,204,190,.28),transparent 58%),radial-gradient(820px 680px at 88% 70%,rgba(120,180,215,.24),transparent 60%),linear-gradient(180deg,#aee6ea 0%,#79cfd6 18%,#4fbcc4 38%,#2fa1b6 58%,#2686ac 78%,#1e6fa0 100%)}
  body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1300px 620px at 50% -14%,rgba(255,255,255,.6),rgba(255,255,255,0) 62%)}
  body::after{content:"";position:fixed;top:-25%;right:-25%;bottom:-25%;left:-25%;inset:-25%;z-index:0;pointer-events:none;opacity:.26;background:repeating-linear-gradient(101deg,rgba(255,255,255,.09) 0 24px,transparent 24px 140px);-webkit-mask:linear-gradient(180deg,#000,transparent 72%);mask:linear-gradient(180deg,#000,transparent 72%);animation:rays 22s ease-in-out infinite}
  @keyframes rays{0%,100%{transform:translateX(0) skewX(0deg)}50%{transform:translateX(34px) skewX(-2deg)}}
  .orb{position:fixed;border-radius:50%;filter:blur(46px);opacity:.5;pointer-events:none;z-index:0}
  .orb.a{width:300px;height:300px;background:rgba(255,255,255,.42);top:-40px;left:-60px}
  .orb.b{width:340px;height:340px;background:rgba(159,209,230,.5);bottom:-80px;right:-70px}
  .orb.c{width:260px;height:260px;background:rgba(255,255,255,.32);top:44%;left:-90px}
  @keyframes cfloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(16px,-20px) scale(1.06)}66%{transform:translate(-12px,10px) scale(.97)}}
  .orb.a{animation:cfloat 20s ease-in-out infinite}
  .orb.b{animation:cfloat 26s ease-in-out infinite reverse}
  .orb.c{animation:cfloat 23s ease-in-out infinite}
  .sparkles{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:0;pointer-events:none}
  .sparkles i{position:absolute;border-radius:50%;opacity:.26;animation:bubble 6s ease-in-out infinite}
  @keyframes bubble{0%,100%{opacity:.08;transform:translateY(7px) scale(.82)}50%{opacity:.4;transform:translateY(-7px) scale(1.15)}}
  .bloom-wrap{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-end;height:150px;overflow:visible;z-index:1;pointer-events:none;margin:-6px 0 28px}
  .bloom{width:320px;max-width:70vw;transform-origin:bottom center;opacity:0;transform:translateY(10px) scale(.05);transition:transform 1s linear,opacity 1.2s linear}
  .bloom svg{width:100%;height:auto;display:block}
  .meadow{position:fixed;left:4px;top:64px;bottom:30px;width:60px;display:flex;flex-direction:column-reverse;align-items:center;z-index:1;pointer-events:none;overflow:hidden}
  .mf{flex:none;margin-top:-10px;transform-origin:bottom center;line-height:0;opacity:.92;filter:drop-shadow(0 3px 6px rgba(15,60,85,.2))}
  .mf.new{animation:mfin 2.4s ease-out}
  @keyframes mfin{0%{opacity:0;transform:translateY(16px) scale(.14)}60%{opacity:.92}100%{opacity:.92;transform:translateY(0) scale(1)}}
  .mcount{position:fixed;left:8px;bottom:8px;z-index:2;font-size:10px;font-weight:800;color:#123c4d;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.55);border-radius:12px;padding:3px 9px;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);pointer-events:none;box-shadow:0 3px 9px rgba(15,60,85,.12)}
  @media(prefers-reduced-motion:reduce){.bloom{transition:none}.mf.new{animation:none}}
  @keyframes twk{0%,100%{opacity:.1;transform:scale(.8)}50%{opacity:.7;transform:scale(1.25)}}
  @keyframes aura{0%,100%{opacity:.8}50%{opacity:1}}
  .dial::before{animation:aura 7s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){.orb,.sparkles i,.dial::before{animation:none}}
  .topbar{width:100%;max-width:1000px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;position:relative;z-index:5;gap:8px;flex-wrap:wrap}
  .editbar{display:flex;gap:8px;flex-wrap:wrap}
  .editToggle{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.32);color:var(--mint-d);font-weight:800;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;padding:9px 15px;border-radius:14px;cursor:pointer;-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);transition:.18s;box-shadow:0 4px 11px rgba(15,60,85,.08),inset 0 1px 0 rgba(255,255,255,.5)}
  .editToggle:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(70,90,120,.18),inset 0 1px 0 #fff}
  .editToggle.on{background:linear-gradient(135deg,var(--mint-d),var(--sky-d));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(107,181,145,.4),inset 0 1px 0 rgba(255,255,255,.4)}
  .editToggle.exp{border-color:rgba(216,180,92,.6);color:var(--gold-d)}
  .editToggle.agent{border-color:rgba(233,166,188,.65);color:var(--rose-d)}
  /* ikony-mandale */
  .mi{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:#1f4a5c;font-weight:800;transition:.18s;box-shadow:0 5px 13px rgba(15,60,85,.1),inset 0 1px 0 rgba(255,255,255,.5);overflow:visible}
  .mi::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0 13deg,rgba(255,255,255,.16) 13deg 15deg);pointer-events:none}
  .mi .glyph{position:relative;z-index:1;line-height:1}
  .mi:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 9px 18px rgba(15,60,85,.16);border-color:rgba(216,180,92,.55)}
  .mi.on{background:linear-gradient(135deg,rgba(107,181,145,.92),rgba(95,150,189,.92));border-color:transparent;color:#fff}
  .tagline,.note,.spamini,.kstrip,.rentmini{display:none}
  .langswitch{display:flex;gap:4px;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.42);border-radius:16px;padding:4px;-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 11px rgba(15,60,85,.08)}
  .langswitch button{border:none;background:none;cursor:pointer;font-size:17px;padding:6px 8px;border-radius:50%;transition:.18s;filter:grayscale(.4) opacity(.65)}
  .langswitch button:hover{filter:grayscale(0) opacity(1)}
  .langswitch button.on{background:rgba(255,255,255,.42);filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .head{text-align:center;margin-bottom:4px;position:relative;z-index:2;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.38);border-radius:16px;padding:5px 14px;-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);box-shadow:0 6px 16px rgba(15,60,85,.09),inset 0 1px 0 rgba(255,255,255,.5)}
  .wordmark{font-size:17px;font-weight:800;letter-spacing:.4px;display:inline-flex;align-items:center;gap:7px;background:linear-gradient(100deg,var(--sky-d),var(--rose-d) 55%,var(--mint-d));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lotus-ico{width:18px;height:18px}
  .premium{display:inline-block;margin-left:5px;font-size:8px;font-weight:800;letter-spacing:1.5px;color:var(--gold-d);border:1px solid var(--gold-l);border-radius:20px;padding:2px 7px;vertical-align:middle;background:#fffdf7}
  .tagline{color:#2b5566;font-size:11px;margin-top:8px;letter-spacing:1.5px}
  .monthnav{display:flex;align-items:center;gap:7px;margin:4px 0 2px;position:relative;z-index:5;
    background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.42);border-radius:30px;padding:6px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 7px 20px rgba(15,60,85,.1),inset 0 1px 0 rgba(255,255,255,.55)}
  .monthnav button{border:1px solid rgba(143,191,222,.5);background:linear-gradient(180deg,#fff,#eef4fa);cursor:pointer;font-size:15px;font-weight:800;color:var(--sky-d);width:32px;height:32px;border-radius:50%;transition:.18s;box-shadow:0 3px 8px rgba(70,90,120,.14),inset 0 1px 0 #fff;display:flex;align-items:center;justify-content:center}
  .monthnav button:hover{color:#fff;background:linear-gradient(135deg,var(--sky-d),var(--rose-d));border-color:transparent;box-shadow:0 0 0 4px rgba(143,191,222,.22),0 6px 14px rgba(95,150,189,.4);transform:translateY(-1px)}
  .monthnav button:active{transform:translateY(0)}
  .monthnav .mlabel{font-size:13px;font-weight:800;min-width:132px;text-align:center;text-transform:uppercase;letter-spacing:2px;color:#12455a;
    padding:6px 14px;border-radius:14px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.4);
    box-shadow:inset 0 1px 4px rgba(15,60,85,.08),inset 0 -1px 0 rgba(255,255,255,.55);text-shadow:0 1px 6px rgba(255,255,255,.7)}
  .monthsum{display:inline-flex;align-items:center;gap:11px;font-size:11px;font-weight:800;letter-spacing:.2px;color:#2b5566;margin-top:5px;position:relative;z-index:2;
    background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.38);border-radius:16px;padding:4px 13px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 9px rgba(15,60,85,.07);max-width:94vw}
  .ms-i{display:inline-flex;align-items:center;gap:5px}
  .ms-i i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 0 6px rgba(15,60,85,.25)}
  .ms-i i.d1{background:var(--sky-d)} .ms-i i.d2{background:var(--rose-d)}
  .ms-i b{color:var(--mint-d)} .ms-i.ms-sum{color:#123c4d}
  /* two wheels */
  .wheels{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap;position:relative;z-index:2;margin-top:8px}
  .spawrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  .spatitle{font-size:15px;font-weight:800;color:#0d3949;display:flex;align-items:center;gap:8px;text-shadow:0 1px 7px rgba(255,255,255,.8),0 0 2px rgba(255,255,255,.6)}
  .spatitle .dotc{width:12px;height:12px;border-radius:50%}
  .spatitle input{font-size:15px;font-weight:800;border:1px solid var(--gold-l);border-radius:10px;padding:3px 8px;text-align:center;font-family:inherit}
  .spamini{font-size:11px;color:#f0fbff;font-weight:700;text-align:center;letter-spacing:.3px;text-shadow:0 1px 4px rgba(15,60,85,.5)}
  .spamini b{color:var(--mint-d)}
  .dialbox{width:384px;height:384px;position:relative}
  .dialbox .dial{position:absolute;top:0;left:0;transform:scale(.64);transform-origin:top left;margin:0}
  .dial{position:relative;width:600px;height:600px;z-index:2;flex:none;touch-action:none;perspective:1200px}
  .dial::before{content:"";position:absolute;top:-22px;right:-22px;bottom:-22px;left:-22px;inset:-22px;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle,rgba(233,166,188,.20),rgba(143,191,222,.13) 54%,transparent 72%)}
  .dial-lotus{position:absolute;left:50%;top:50%;transform:translate(-50%,-53%);width:130%;height:130%;color:var(--gold-d);opacity:.14;z-index:0;pointer-events:none}
  .pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:8;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:22px solid var(--gold);filter:drop-shadow(0 4px 6px rgba(184,147,63,.5))}
  .pointer::after{content:"";position:absolute;left:-8px;top:-26px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6df,var(--gold));box-shadow:0 3px 8px rgba(184,147,63,.6)}
  .wheel{position:absolute;top:10px;right:10px;bottom:10px;left:10px;inset:10px;z-index:3;cursor:grab;transform-origin:50% 50%;will-change:transform}
  .wheel.grab{cursor:grabbing}
  .wheel.snap{transition:transform .5s cubic-bezier(.18,.9,.22,1)}
  .ring{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;border-radius:50%;opacity:.92;box-shadow:0 24px 50px rgba(20,60,85,.2),0 0 0 2px rgba(216,180,92,.28),inset 0 16px 30px rgba(255,255,255,.85),inset 0 -30px 52px rgba(45,65,95,.26),inset 0 0 0 2px rgba(255,255,255,.5)}
  .dial.z .ring{background:conic-gradient(from -90deg,var(--sky-soft),var(--sky-soft) 40%,var(--mint-soft) 70%,var(--sky-soft))}
  .dial.s .ring{background:conic-gradient(from -90deg,var(--rose-soft),var(--rose-soft) 40%,#f6e3d0 70%,var(--rose-soft))}
  .rim{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(184,147,63,.0) 0deg 2.4deg,rgba(216,180,92,.55) 2.4deg 3deg);-webkit-mask:radial-gradient(circle,transparent 0 47.3%,#000 47.6% 50%,transparent 50.2%);mask:radial-gradient(circle,transparent 0 47.3%,#000 47.6% 50%,transparent 50.2%)}
  .rim2{position:absolute;top:-4px;right:-4px;bottom:-4px;left:-4px;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,#f8ecd2,#c9ab68,#fff8e8,#bd9c56,#f8ecd2,#c9ab68,#fff8e8,#bd9c56,#f8ecd2);-webkit-mask:radial-gradient(circle,transparent 0 49%,#000 49.3% 50.4%,transparent 51%);mask:radial-gradient(circle,transparent 0 49%,#000 49.3% 50.4%,transparent 51%)}
  .face{position:absolute;top:58px;right:58px;bottom:58px;left:58px;inset:58px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(120,145,175,.04) 0deg 8.5deg,rgba(120,145,175,.11) 8.5deg 9deg),radial-gradient(circle at 42% 34%,#ffffff,#eef3f9 70%,#e4ebf3);box-shadow:inset 0 0 0 1px rgba(216,180,92,.30),inset 0 8px 22px rgba(70,90,120,.12)}
  .face .facelotus{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;margin:auto;width:180px;height:180px;color:var(--rose-d);opacity:.05}
  .node{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;z-index:4;transition:box-shadow .2s,transform .15s;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:2px solid #ffffff;box-shadow:0 10px 20px rgba(70,90,120,.22),0 0 0 1px rgba(216,180,92,.28),inset 0 3px 4px rgba(255,255,255,.95),inset 0 -6px 11px rgba(70,90,120,.16);cursor:pointer}
  .node .nc{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .node .dnum{font-size:17px;font-weight:800;color:var(--ink)}
  .node .dwd{font-size:8.5px;font-weight:800;color:var(--muted);margin-top:1px}
  .node.weekend .dnum{color:var(--rose-d)}
  .node.filled{background:rgba(220,235,245,.92);border-color:var(--sky)}
  .node.done{background:rgba(222,240,232,.95);border-color:var(--mint-d)}
  .node.done .dnum{color:var(--mint-d)}
  .node.today{box-shadow:0 0 0 4px rgba(233,166,188,.35),0 10px 22px rgba(211,128,155,.3)}
  .node.sel{outline:3px solid var(--gold);outline-offset:3px;transform:scale(1.14);z-index:5}
  .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:340px;height:340px;border-radius:50%;z-index:6;cursor:pointer;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35);box-shadow:0 20px 46px rgba(70,90,120,.24),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -10px 30px rgba(70,90,120,.14),inset 0 0 0 1px rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 30px;overflow:hidden}
  .core-lotus{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:250px;height:250px;color:var(--rose-d);opacity:.06;z-index:0;pointer-events:none}
  .core>*{position:relative;z-index:1}
  .core .halo{position:absolute;top:9px;right:9px;bottom:9px;left:9px;inset:9px;border-radius:50%;border:1px solid rgba(216,180,92,.4);pointer-events:none;z-index:1}
  .ctime{font-size:12px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,var(--sky-d),var(--rose-d));-webkit-background-clip:text;background-clip:text;color:transparent}
  .core h2{font-size:20px;font-weight:800;line-height:1.15;margin-top:5px}
  .csum{font-size:34px;font-weight:800;margin-top:8px;color:var(--ink)}
  .cstat{margin-top:9px;font-size:12.5px;font-weight:800;padding:5px 16px;border-radius:20px;display:inline-block}
  .cstat.todo{background:var(--sky-soft);color:var(--sky-d)}
  .cstat.done{background:var(--mint-soft);color:var(--mint-d)}
  .open-proc{margin-top:15px;border:none;cursor:pointer;color:#fff;font-weight:800;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;padding:0 24px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--rose),var(--rose-d));box-shadow:0 10px 22px rgba(211,128,155,.42),inset 0 1px 0 rgba(255,255,255,.4);transition:.16s}
  .open-proc:hover{filter:brightness(1.05)}
  .scrim{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(70,80,110,.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:30}
  .scrim.open{opacity:1;pointer-events:auto}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;width:580px;max-width:94vw;max-height:92vh;overflow-y:auto;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:32px;box-shadow:0 30px 70px rgba(70,80,110,.4),inset 0 0 0 1px rgba(255,255,255,.7);padding:22px;z-index:31;transition:.3s cubic-bezier(.2,.85,.2,1)}
  .modal.open{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
  .mtitle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#3a4a63}
  .mtitle .lot{width:24px;height:24px;color:var(--rose-d)}
  .mclose{cursor:pointer;background:linear-gradient(180deg,#fff,#eef1f6);border:1px solid rgba(143,191,222,.4);border-radius:12px;padding:7px 13px;color:#6b7085;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;flex:none;transition:.15s;box-shadow:inset 0 1px 0 #fff}
  .mclose:hover{color:var(--rose-d);border-color:rgba(233,166,188,.6);transform:translateY(-1px)}
  .msub{font-size:12px;color:var(--muted);margin-bottom:12px}
  .st-sec{background:#fff;border:1px solid #eef0f4;border-radius:18px;padding:13px 14px;margin-bottom:10px}
  .st-sec .lab{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--sky-d);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(120,145,175,.16)}
  .st-sec .ic{width:27px;height:27px;border-radius:9px;background:var(--sky-soft);display:flex;align-items:center;justify-content:center;font-size:14px}
  .st-sec.scans .ic{background:#f2ecdc} .st-sec.scans .lab{color:var(--gold-d)}
  .st-sec.sum{background:linear-gradient(120deg,#fffaf0,#f7ecd6);border-color:#ecdcb8}

  /* ---------- store ---------- */
  const STORE_KEY="spa_rozl_v2", SPA_KEY="spa_lista_v2", LANG_KEY="spa_lang";
  let data={}; try{data=JSON.parse(localStorage.getItem(STORE_KEY)||"{}");}catch(e){data={};}
  let spaList; try{spaList=JSON.parse(localStorage.getItem(SPA_KEY)||"null");}catch(e){spaList=null;}
  if(!Array.isArray(spaList)||spaList.length<2){spaList=["Zwierzyniecka","Szewska"];}
  let lang=localStorage.getItem(LANG_KEY)||"PL"; if(lang!=="PL"&&lang!=="TH")lang="PL";
  const VERI_KEY="spa_veri_v1";
  let veri={}; try{veri=JSON.parse(localStorage.getItem(VERI_KEY)||"{}");}catch(e){veri={};}
  const RENT_KEY="spa_rent_v1";

  function saveVeri(){try{localStorage.setItem(VERI_KEY,JSON.stringify(veri));}catch(e){toast("Pamięć pełna — użyj 💾 Eksport");}}

  /* ---------- helpers ---------- */
  const today=new Date();
  let curY=today.getFullYear(), curM=today.getMonth();
  let editMode=false, mSpa=0, mDay=1;
  const mkey=(y,m)=>y+"-"+String(m+1).padStart(2,"0");
  const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
  const fmt=n=>{n=Math.round((+n||0)*100)/100;return n.toLocaleString("pl-PL",{minimumFractionDigits:2,maximumFractionDigits:2})+" zł";};
  const DS=600,C=300,R=250; let N=31,STEP=360/31;

  function dayRec(y,m,d,spa){const k=mkey(y,m);data[k]=data[k]||{};data[k][d]=data[k][d]||{};
    if(!data[k][d][spa])data[k][d][spa]={tx:[],sumy:{},raport:"",bony:"",kasetka:"",uwagi:"",status:"todo",scans:{r1:null,r2:null}};
    const r=data[k][d][spa];if(!r.scans)r.scans={r1:null,r2:null};if(!Array.isArray(r.tx))r.tx=[];if(!r.sumy)r.sumy={};if(r.bony===undefined)r.bony="";return r;}
  function getRec(y,m,d,spa){const k=mkey(y,m);return data[k]&&data[k][d]&&data[k][d][spa];}
  // sumy metod = ręcznie wpisane pola (r.sumy); obrót = ich suma
  function methodTotals(r){const t={};METHOD_CODES.forEach(c=>t[c]=(r&&r.sumy&&(+r.sumy[c]||0))||0);return t;}
  function txMethodTotals(r){const t={};METHOD_CODES.forEach(c=>t[c]=0);if(r&&r.tx)r.tx.forEach(x=>{const c=METHOD_CODES.includes(x.metoda)?x.metoda:'g';t[c]+=(+x.kwota||0);});return t;}
  function spaObrot(r){if(!r)return 0;const t=methodTotals(r);let s=0;METHOD_CODES.forEach(c=>s+=t[c]);return s;}
  function sumyFromTx(r){const tt=txMethodTotals(r);r.sumy={};METHOD_CODES.forEach(c=>{if(tt[c])r.sumy[c]=tt[c];});}
  function anySumy(r){if(!r||!r.sumy)return false;return METHOD_CODES.some(c=>(+r.sumy[c]||0)>0);}
  function hasData(r){if(!r)return false;if(r.tx&&r.tx.length)return true;if(anySumy(r))return true;if(r.raport||r.bony||r.kasetka||r.uwagi)return true;if(r.scans&&(r.scans.r1||r.scans.r2))return true;return false;}

  /* ---------- wheels ---------- */
  const WHEELS=[];
  function buildWheelDOM(i){
    const wrap=document.createElement('div');wrap.className='spawrap';
    wrap.innerHTML=`<div class="spatitle" id="spatitle${i}"></div>
      <div class="dialbox"><div class="dial ${i===0?'z':'s'}" id="dial${i}">
        <svg class="dial-lotus"><use href="#lotus"/></svg><div class="pointer"></div>
        <div class="wheel" id="wheel${i}"><div class="ring"></div><div class="rim2"></div><div class="rim"></div><div class="face"><svg class="facelotus"><use href="#lotus"/></svg></div></div>
        <div class="core" id="core${i}"></div>
      </div></div>
      <div class="spamini" id="spamini${i}"></div>`;
    document.getElementById('wheels').appendChild(wrap);
    const w={i,dial:wrap.querySelector('#dial'+i),wheel:wrap.querySelector('#wheel'+i),core:wrap.querySelector('#core'+i),
      titleEl:wrap.querySelector('#spatitle'+i),miniEl:wrap.querySelector('#spamini'+i),rot:0,active:0,nodes:[]};
    w.core.addEventListener('click',()=>openDay(i,w.active));
    initDrag(w);
    return w;
  }
  function buildWheel(w){
    w.nodes.forEach(n=>n.remove());w.nodes=[];
    for(let d=1;d<=N;d++){
      const idx=d-1, base=-90+idx*STEP, ang=base*Math.PI/180;
      const x=C+R*Math.cos(ang), y=C+R*Math.sin(ang);
      const wd=new Date(curY,curM,d).getDay();
      const nd=document.createElement('div');
      nd.className='node'+((wd===0||wd===6)?' weekend':'');
      nd.style.left=x+'px';nd.style.top=y+'px';
      nd.innerHTML=`<div class="nc"><span class="dnum">${d}</span><span class="dwd">${WD[lang][wd]}</span></div>`;
      w.wheel.appendChild(nd);w.nodes.push(nd);
    }
    paintNodes(w);
  }
  function paintNodes(w){const k=mkey(curY,curM),spa=spaList[w.i];
    w.nodes.forEach((nd,i)=>{const d=i+1,r=data[k]&&data[k][d]&&data[k][d][spa];
      nd.classList.remove('filled','done','today');
      if(r&&r.status==='done')nd.classList.add('done');else if(hasData(r))nd.classList.add('filled');
      if(curY===today.getFullYear()&&curM===today.getMonth()&&d===today.getDate())nd.classList.add('today');
      nd.classList.toggle('sel',i===w.active);});}
  function applyRot(w,anim){w.wheel.classList.toggle('snap',!!anim);w.wheel.style.transform=`rotate(${w.rot}deg)`;
    w.nodes.forEach(nd=>{nd.querySelector('.nc').style.transform=`rotate(${-w.rot}deg)`;});
    const idx=((Math.round(-w.rot/STEP)%N)+N)%N;if(idx!==w.active){w.active=idx;renderCore(w);}
    w.nodes.forEach((nd,i)=>nd.classList.toggle('sel',i===w.active));}
  function spinTo(w,idx,anim){w.rot=-idx*STEP;applyRot(w,anim!==false);}
  function renderCore(w){const d=w.active+1,spa=spaList[w.i],r=getRec(curY,curM,d,spa),T=L[lang];
    const wd=WD[lang][new Date(curY,curM,d).getDay()],tot=spaObrot(r),done=r&&r.status==='done';
    w.core.innerHTML=`<svg class="core-lotus"><use href="#lotus"/></svg><div class="halo"></div>
      <div class="ctime">${wd} · ${d} ${MONTHS[lang][curM]}</div>
      <h2>${T.coreTitle}</h2><div class="csum">${fmt(tot)}</div>
      <div class="cstat ${done?'done':'todo'}">${done?T.statDone:T.statTodo}</div>
      <button class="open-proc" onclick="event.stopPropagation();openDay(${w.i},${w.active})">${T.openDay}</button>`;}

  /* uniwersalna obsluga krecenia: mysz + dotyk (iPad) */
  function makeDrag(w,step,apply,openFn){
    w._dragged=false;let dragging=false,pid=null,startAng=0,startRot=0,lastAng=0,vel=0,lastT=0,raf=null,dx=0,dy=0;
    const norm=(a)=>{while(a>180)a-=360;while(a<-180)a+=360;return a;};
    const angleAt=(e)=>{const r=w.dial.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;};
    w.dial.addEventListener('pointerdown',(e)=>{
      if(e.target.closest('.core'))return;
      e.preventDefault();
      dragging=true;pid=e.pointerId;w._dragged=false;cancelAnimationFrame(raf);
      dx=e.clientX;dy=e.clientY;vel=0;
      w.wheel.classList.remove('snap');w.wheel.classList.add('grab');
      startAng=angleAt(e);startRot=w.rot;lastAng=startAng;lastT=performance.now();
      try{w.dial.setPointerCapture(e.pointerId);}catch(err){}
    },{passive:false});
    w.dial.addEventListener('pointermove',(e)=>{
      if(!dragging||e.pointerId!==pid)return;
      e.preventDefault();
      const a=angleAt(e);w.rot=startRot+norm(a-startAng);
      const now=performance.now();vel=norm(a-lastAng)/Math.max(1,now-lastT);lastAng=a;lastT=now;
      if(Math.abs(e.clientX-dx)>7||Math.abs(e.clientY-dy)>7)w._dragged=true;
      apply(w,false);
    },{passive:false});
    const end=(e)=>{
      if(!dragging)return;dragging=false;w.wheel.classList.remove('grab');
      try{w.dial.releasePointerCapture(pid);}catch(err){}
      if(!w._dragged&&e&&e.clientX!=null){          /* stuknięcie, nie przeciąganie */
        const el=document.elementFromPoint(e.clientX,e.clientY);
        const nd=el&&el.closest?el.closest('.node'):null;
        const idx=nd?w.nodes.indexOf(nd):-1;
        if(idx>=0){w.rot=-idx*step;apply(w,true);openFn(w.i,idx);return;}
      }
      let v=vel*16;
      (function glide(){if(Math.abs(v)>0.25){w.rot+=v;v*=0.94;apply(w,false);raf=requestAnimationFrame(glide);}
        else{w.rot=Math.round(w.rot/step)*step;apply(w,true);}})();
    };
    w.dial.addEventListener('pointerup',end);
    w.dial.addEventListener('pointercancel',end);
    w.dial.addEventListener('lostpointercapture',()=>{if(dragging)end(null);});
    w.dial.addEventListener('wheel',(e)=>{e.preventDefault();cancelAnimationFrame(raf);
      w.rot+=(e.deltaY>0?-step:step);w.rot=Math.round(w.rot/step)*step;apply(w,true);},{passive:false});
  }
  function initDrag(w){makeDrag(w,STEP,applyRot,openDay);}

  function renderTitles(){const T=L[lang];WHEELS.forEach(w=>{const col=w.i===0?'var(--sky-d)':'var(--rose-d)';
    w.titleEl.innerHTML=editMode
      ? `<span class="dotc" style="background:${col}"></span><input value="${spaList[w.i].replace(/"/g,'&quot;')}" onchange="renameSpa(${w.i},this.value)">`
      : `<span class="dotc" style="background:${col}"></span>${spaList[w.i]}`;});}
  function renderMinis(){const k=mkey(curY,curM),T=L[lang];
    WHEELS.forEach(w=>{const md=data[k]||{},spa=spaList[w.i];let sum=0,done=0,used=0;
      for(const d in md){if(md[d][spa]){const r=md[d][spa];const o=spaObrot(r);if(hasData(r)||r.status==='done')used++;sum+=o;if(r.status==='done')done++;}}
      w.miniEl.innerHTML=`${T.monthSum}: <b>${fmt(sum)}</b> · ${T.monthDone} <b>${done}</b>/${N}`;});}
  function renderMonthTop(){const T=L[lang];document.getElementById('mlabel').textContent=`${MSHORT[lang][curM]} ${curY}`;
    const k=mkey(curY,curM),md=data[k]||{};let a=0,b=0;
    for(const d in md){if(md[d][spaList[0]])a+=spaObrot(md[d][spaList[0]]);if(md[d][spaList[1]])b+=spaObrot(md[d][spaList[1]]);}
    const ab=(s)=>s.slice(0,2);
    document.getElementById('monthsum').innerHTML=`<span class="ms-i" title="${spaList[0]}"><i class="d1"></i>${ab(spaList[0])} <b>${fmt(a)}</b></span><span class="ms-i" title="${spaList[1]}"><i class="d2"></i>${ab(spaList[1])} <b>${fmt(b)}</b></span><span class="ms-i ms-sum">Σ <b>${fmt(a+b)}</b></span>`;}

  function renderStatic(){const T=L[lang];
    document.getElementById('agBtn').title=T.agBtnLabel;
    document.getElementById('kopBtn').title=T.kTitle;

      return `<div class="lg-item"><span class="swatch" ${sw}></span> ${T.leg[i]}</div>`;}).join('');}

  function renderAll(){N=daysInMonth(curY,curM);STEP=360/N;
    WHEELS.forEach(w=>{w.active=Math.min(w.active,N-1);buildWheel(w);w.rot=-w.active*STEP;applyRot(w,false);renderCore(w);});
    renderTitles();renderMinis();renderMonthTop();if(RENTWHEELS.length)renderRentAll();updateKopilotStrip();}

  function changeMonth(delta){curM+=delta;if(curM>11){curM=0;curY++;}if(curM<0){curM=11;curY--;}renderAll();toast(`${MONTHS[lang][curM]} ${curY}`);}
  window.changeMonth=changeMonth;
  function setLang(lg){lang=lg;document.documentElement.lang=(lg==="TH"?"th":"pl");localStorage.setItem(LANG_KEY,lg);
    document.getElementById('lPL').classList.toggle('on',lg==="PL");document.getElementById('lTH').classList.toggle('on',lg==="TH");

  window.setLang=setLang;

  function renameSpa(i,val){const old=spaList[i],nn=val.trim()||old;
    if(old!==nn&&!spaList.includes(nn)){for(const k in data){for(const d in data[k]){if(data[k][d][old]){data[k][d][nn]=data[k][d][old];delete data[k][d][old];}}}}
    spaList[i]=nn;saveSpa();saveData();renderTitles();renderMinis();renderMonthTop();}
  window.renameSpa=renameSpa;
  function toggleEdit(){editMode=!editMode;const b=document.getElementById('edBtn');b.classList.toggle('on',editMode);
    b.querySelector('.glyph').textContent=editMode?'👁️':'✏️';b.title=editMode?L[lang].edDone:L[lang].edEdit;renderTitles();toast(editMode?L[lang].tEditOn:L[lang].tEditOff);}
  window.toggleEdit=toggleEdit;

  /* ---------- day modal ---------- */
  function openDay(i,idx){mSpa=i;mDay=idx+1;const w=WHEELS[i];w.active=idx;spinTo(w,idx,true);renderCore(w);renderDay();
    document.getElementById('dayModal').classList.add('open');document.getElementById('scrim').classList.add('open');}
  window.openDay=openDay;
  // Różnica = (Obrót usług + Bony sprzedane) − Raport dobowy. Bo raport dobowy z kasy zawiera i usługi, i sprzedane bony.
  function cmp(r){const T=L[lang],tot=spaObrot(r),sold=+r.bony||0,has=r.raport!==""&&r.raport!=null,man=+r.raport||0,diff=(tot+sold)-man;
    let cls="neu",txt="—";if(has){if(Math.abs(diff)<0.005){cls="ok";txt=T.zgodne;}else{cls="bad";txt=(diff>0?"+":"")+fmt(diff);}}return{tot,sold,cls,txt};}

  function renderDay(){const spa=spaList[mSpa],d=mDay,r=dayRec(curY,curM,d,spa),T=L[lang];
    const wd=WD[lang][new Date(curY,curM,d).getDay()],mt=methodTotals(r),tot=spaObrot(r),cp=cmp(r);
    const optionRow=(sel)=>METHODS.map(m=>`<option value="${m[0]}" ${m[0]===sel?'selected':''}>${lang==='TH'?m[2]:m[1]}</option>`).join('');
    const txRows=(r.tx||[]).map((t,ti)=>`<tr>
        <td class="txt-czas"><input class="txin czas" type="time" step="300" value="${(t.czas||'').replace(/"/g,'&quot;')}" oninput="setTx(${ti},'czas',this.value)" onchange="setTx(${ti},'czas',this.value)"></td>
        <td class="txt-klient"><input class="txin" value="${(t.klient||'').replace(/"/g,'&quot;')}" placeholder="${T.thKlient}" oninput="setTx(${ti},'klient',this.value)"></td>
        <td class="txt-met"><select class="txsel" onchange="setTx(${ti},'metoda',this.value)">${optionRow(t.metoda||'g')}</select></td>

Zwróć TYLKO JSON w tym formacie (dwa SPA: ${spaList[0]} i ${spaList[1]}):

  function applyAgentData(obj){
    if(!obj||!obj.spa)throw new Error("no spa");
    let y=curY,m=curM,d=mDay;
    if(obj.data&&/^\d{4}-\d{2}-\d{2}$/.test(obj.data)){const p=obj.data.split('-');y=+p[0];m=+p[1]-1;d=+p[2];}
    const keys=Object.keys(obj.spa);
    keys.forEach((key,ki)=>{let target=spaList.find(s=>s.toLowerCase()===key.toLowerCase());
      if(!target){if(key==="1"||key==="0")target=spaList[+key];else target=spaList[ki];}
      if(!target)return;
      const src=obj.spa[key],rec=dayRec(y,m,d,target);
      if(Array.isArray(src.tx))rec.tx=src.tx.map(t=>({czas:String(t.czas||""),klient:String(t.klient||""),metoda:methodNorm(t.metoda),kwota:(t.kwota===0||t.kwota)?t.kwota:""}));
      // sumy metod: jeśli agent podał gotowe, użyj; inaczej policz z transakcji
      if(src.sumy&&typeof src.sumy==='object'){rec.sumy={};Object.keys(src.sumy).forEach(kk=>{const c=methodNorm(kk);if(src.sumy[kk])rec.sumy[c]=src.sumy[kk];});}
      else if(Array.isArray(src.tx)&&src.tx.length)sumyFromTx(rec);
      if(src.raport!=null)rec.raport=src.raport;
      if(src.bony!=null)rec.bony=src.bony;
      if(src.kasetka!=null)rec.kasetka=src.kasetka;
      if(src.uwagi!=null)rec.uwagi=String(src.uwagi);
    });
    saveData();
    // przejdź na ten dzień
    curY=y;curM=m;renderAll();
    const idx=d-1;WHEELS.forEach(w=>{w.active=idx;spinTo(w,idx,false);renderCore(w);});
    mDay=d;mSpa=0;
    closeAgent();openDay(0,idx);
    toast(L[lang].tApplied);
  }
  function applyAgent(){const raw=document.getElementById('agJson').value.trim();if(!raw){toast(L[lang].tBadJson);return;}
    let obj;try{obj=JSON.parse(raw);}catch(e){const m=raw.match(/\{[\s\S]*\}/);if(m){try{obj=JSON.parse(m[0]);}catch(e2){obj=null;}}}
    if(!obj){toast(L[lang].tBadJson);return;}
    try{applyAgentData(obj);}catch(e){toast(L[lang].tBadJson);}}

      if(hasData(r)||r.status==='done')dni++;if(r.status==='done')dniDone++;}

  function kopilotMeldunki(){const T=L[lang],out=[];const y=curY,m=curM,dim=daysInMonth(y,m);

      if(avg>0&&pAvg>0){const ch=(avg-pAvg)/pAvg*100;if(ch<=-8)out.push({s:'warn',t:`📉 ${spa}: ${T.kAvgDrop} ${Math.round(-ch)}% (${fmt(pAvg)}→${fmt(avg)}) — ${T.kPromo}`});}
      const md=data[mkey(y,m)]||{};let diffD=0;for(const d in md){const r=md[d]&&md[d][spa];if(!r)continue;
        if(r.raport!==''&&r.raport!=null){if(Math.abs((spaObrot(r)+(+r.bony||0))-(+r.raport||0))>=0.5)diffD++;}}
      if(diffD>0)out.push({s:'alert',t:`⚠️ ${spa}: ${diffD} ${T.kDniRoznica}`});
    });
    const v=veri[mkey(y,m)];if(v){let bad=0;['planeta','payu'].forEach(op=>(v[op]||[]).forEach(r=>{if(Math.abs((+r.wplynelo||0)-(+r.wbite||0))>=0.5)bad++;}));(v.przelewy||[]).forEach(r=>{if(!(r.status==='ok'||r.status===true))bad++;});
      if(bad>0)out.push({s:'alert',t:`🏦 ${T.kVeri} ${bad} ${T.kPozycji}`});}
    if(cur){let todo=0;const md=data[mkey(y,m)]||{};for(let d=1;d<=elapsed;d++){let any=false;spaList.forEach(spa=>{const r=md[d]&&md[d][spa];if(r&&hasData(r))any=true;});if(!any)todo++;}
      if(todo>0)out.push({s:'warn',t:`🗓️ ${todo} ${T.kDniBrak}`});}
    if(haveRent)out.push({s:'info',t:`🔮 ${T.kProg}: ${totFore>=0?'+':''}${fmt(totFore)} (${T.rRazem})`});
    else out.push({s:'info',t:`ℹ️ ${T.kNoRent}`});
    try{const lb=localStorage.getItem(LB_KEY),oldB=!lb||((Date.now()-new Date(lb).getTime())/86400000>10);
      if(oldB&&Object.keys(data).length>0)out.push({s:'warn',t:`💾 ${T.kBackup}`});}catch(e){}
    const ord={alert:0,warn:1,info:2,ok:3};out.sort((a,b)=>ord[a.s]-ord[b.s]);return out;}
  function updateKopilotStrip(){const T=L[lang],md=kopilotMeldunki(),notable=md.filter(x=>x.s==='alert'||x.s==='warn');
    const badge=document.getElementById('kopBadge');if(badge){if(notable.length){badge.style.display='';badge.textContent=notable.length;}else badge.style.display='none';}
    const strip=document.getElementById('kopilotStrip');if(!strip)return;const top=md[0];
    if(top&&(top.s==='alert'||top.s==='warn')){strip.style.display='';strip.className='kstrip '+top.s;
      strip.innerHTML=`<span class="kdot"></span><span>${top.t}</span><span class="kmore">${notable.length>1?('+'+(notable.length-1)+' '+T.kMore+' →'):'→'}</span>`;}
    else strip.style.display='none';}
  function renderKopilot(){const T=L[lang],md=kopilotMeldunki();
    const rows=md.length?md.map(x=>`<div class="meld ${x.s}"><span>${x.t}</span></div>`).join(''):`<div class="meld ok"><span>${T.kAllOk}</span></div>`;
    document.getElementById('kopilotBody').innerHTML=`
      <div class="mhead"><div class="mtitle"><span style="font-size:18px">🛰️</span> ${T.kTitle} · ${MONTHS[lang][curM]} ${curY}</div><div class="mclose" onclick="closeKopilot()">${T.close}</div></div>
      <div class="msub">${T.kSub}</div>${rows}
      <div class="st-foot"><button class="go" onclick="closeKopilot()">${T.close}</button></div>`;}
  function openKopilot(){renderKopilot();document.getElementById('kopilotModal').classList.add('open');document.getElementById('scrim').classList.add('open');}
  window.openKopilot=openKopilot;
  function closeKopilot(){document.getElementById('kopilotModal').classList.remove('open');if(!anyModalOpen())document.getElementById('scrim').classList.remove('open');}
  window.closeKopilot=closeKopilot;

  /* ---------- kosmos czasu (galaktyka roku) ---------- */
  let galaxyYear=curY;
  function monthObrAll(y,m){let s=0;spaList.forEach(spa=>s+=obrotMonth(y,m,spa));return s;}
  function monthZyskAll(y,m){let s=0;spaList.forEach(spa=>s+=rentZysk(y,m,spa));return s;}
  function renderGalaxy(){const T=L[lang],Cx=330,Cy=330,R=246;const os=[];let maxO=0;
    for(let m=0;m<12;m++){const o=monthObrAll(galaxyYear,m);os.push(o);if(o>maxO)maxO=o;}
    let html=`<div class="galaxywrap"><div class="gtitle">🌌 ${T.galTitle} ${galaxyYear}</div><div class="gclose" onclick="closeGalaxy()">${T.close}</div>`;
    let totO=0,totZ=0;
    for(let m=0;m<12;m++){const ang=(-90+m*30)*Math.PI/180,x=Cx+R*Math.cos(ang),y=Cy+R*Math.sin(ang),o=os[m];totO+=o;
      const z=monthZyskAll(galaxyYear,m);totZ+=z;
      const has=o>0||rentHasData(galaxyYear,m,spaList[0])||rentHasData(galaxyYear,m,spaList[1]);
      let cls=has?(z>0?'zysk':(z<0?'strata':'neutral')):'empty';
      const isCur=(galaxyYear===today.getFullYear()&&m===today.getMonth());
      const sz=42+(maxO?Math.round(46*(o/maxO)):0),lab=o>=1000?Math.round(o/1000)+'k':(o>0?Math.round(o):'');
      html+=`<div class="gstar ${cls} ${isCur?'cur':''}" style="left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;margin:${-sz/2}px 0 0 ${-sz/2}px" onclick="galaxyPick(${m})" title="${MONTHS[lang][m]} — ${fmt(o)}"><span class="gm">${MSHORT[lang][m]}</span></div>`;
      html+=`<div class="glabel" style="left:${x}px;top:${y+sz/2+8}px">${lab}</div>`;}
    html+=`<div class="gcenter"><div class="gyearnav"><button onclick="galaxyYearNav(-1)">‹</button><span>${galaxyYear}</span><button onclick="galaxyYearNav(1)">›</button></div>
      <div class="gtot">${fmt(totO)}</div><div class="gtot" style="font-size:15px;color:${totZ>=0?'#bfe9cf':'#f6c9d6'}">${totZ>=0?'+':''}${fmt(totZ)}</div></div></div>`;
    document.getElementById('galaxyBody').innerHTML=html;}
  function openGalaxy(){galaxyYear=curY;renderGalaxy();document.getElementById('galaxyModal').classList.add('open');document.getElementById('scrim').classList.add('open');}
  window.openGalaxy=openGalaxy;
  function closeGalaxy(){document.getElementById('galaxyModal').classList.remove('open');if(!anyModalOpen())document.getElementById('scrim').classList.remove('open');}
  window.closeGalaxy=closeGalaxy;
  function galaxyYearNav(d){galaxyYear+=d;renderGalaxy();}
  window.galaxyYearNav=galaxyYearNav;
  function galaxyPick(m){curY=galaxyYear;curM=m;closeGalaxy();renderAll();toast(`${MONTHS[lang][m]} ${curY}`);}
  window.galaxyPick=galaxyPick;

  /* ---------- export ---------- */
  function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}
  function exportData(){download('rozliczenia_spa_maliwan.json',{spaList,data});toast(L[lang].tSaved);}
  window.exportData=exportData;
  function exportDay(){const d=mDay,dateStr=`${curY}-${String(curM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const out={data:dateStr,spa:{}};spaList.forEach(s=>{const r=getRec(curY,curM,d,s);if(r)out.spa[s]={tx:r.tx,sumy:r.sumy,raport:r.raport,bony:r.bony,kasetka:r.kasetka,uwagi:r.uwagi,obrot:spaObrot(r)};});
    download(`rozliczenie_${dateStr}.json`,out);toast(L[lang].tSavedDay);}
  window.exportDay=exportDay;

  /* ---------- kopia zapasowa ---------- */
  const LB_KEY="spa_lastbackup";
  function lastBackup(){return localStorage.getItem(LB_KEY)||"";}
  function setLastBackup(){try{localStorage.setItem(LB_KEY,new Date().toISOString());}catch(e){}}
  function renderBackup(){const T=L[lang],lb=lastBackup();const lbTxt=lb?new Date(lb).toLocaleString('pl-PL').slice(0,16):T.bkpNever;
    document.getElementById('backupBody').innerHTML=`
      <div class="mhead"><div class="mtitle"><span style="font-size:18px">💾</span> ${T.bkpTitle}</div><div class="mclose" onclick="closeBackup()">${T.close}</div></div>
      <div class="msub">${T.bkpSub}</div>
      <div class="st-sec"><div style="font-size:13px">${T.bkpLast} <b>${lbTxt}</b></div></div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="agbtn sky" onclick="doBackup()">${T.bkpDo}</button>
        <label class="agbtn" style="background:linear-gradient(120deg,var(--gold),var(--gold-d));cursor:pointer">${T.bkpRestore}<input type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(this.files)"></label>
      </div>`;}
  function openBackup(){renderBackup();document.getElementById('backupModal').classList.add('open');document.getElementById('scrim').classList.add('open');}
  window.openBackup=openBackup;
  function closeBackup(){document.getElementById('backupModal').classList.remove('open');if(!anyModalOpen())document.getElementById('scrim').classList.remove('open');}
  window.closeBackup=closeBackup;
  function doBackup(){const stamp=new Date().toISOString().slice(0,10);
    download(`kopia_rozliczenia_${stamp}.json`,{ver:2,spaList,data,veri,rent,lastBackup:new Date().toISOString()});
    setLastBackup();renderBackup();toast(L[lang].tBkp);}
  window.doBackup=doBackup;
  function restoreBackup(files){if(!files||!files[0])return;const fr=new FileReader();
    fr.onload=()=>{try{const o=JSON.parse(fr.result);
      if(o.data&&(o.spaList||o.veri)){if(Array.isArray(o.spaList))spaList=o.spaList;if(o.data)data=o.data;if(o.veri)veri=o.veri;if(o.rent)rent=o.rent;
        saveData();saveSpa();saveVeri();saveRent();renderStatic();renderAll();renderBackup();toast(L[lang].tRestore);}
      else toast(L[lang].tBadJson);}catch(e){toast(L[lang].tBadJson);}};fr.readAsText(files[0]);}
  window.restoreBackup=restoreBackup;

  function closeAll(){closeDay();closeAgent();closeSummary();closeVeri();closeBackup();closeRent();closeKopilot();closeGalaxy();document.getElementById('scrim').classList.remove('open');}
  window.closeAll=closeAll;
  let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2300);}
  window.toast=toast;

  /* ---------- init ---------- */
  document.getElementById('lPL').classList.toggle('on',lang==="PL");
  document.getElementById('lTH').classList.toggle('on',lang==="TH");
  document.documentElement.lang=(lang==="TH"?"th":"pl");
  WHEELS.push(buildWheelDOM(0));WHEELS.push(buildWheelDOM(1));
  RENTWHEELS.push(buildRentWheelDOM(0));RENTWHEELS.push(buildRentWheelDOM(1));
  const initIdx=Math.min(today.getDate()-1,daysInMonth(curY,curM)-1);
  WHEELS.forEach(w=>w.active=initIdx);
  renderStatic();renderAll();
  // kosmiczne iskry (gwiazdy) — czysto dekoracyjne, za treścią
  (function(){const s=document.getElementById('sparkles');if(!s)return;const cols=['rgba(255,255,255,.95)','rgba(206,240,250,.9)','rgba(255,255,255,.75)','rgba(180,230,245,.85)'];let h='';
    for(let i=0;i<15;i++){const x=(Math.random()*100).toFixed(1),y=(Math.random()*100).toFixed(1),d=(Math.random()*5).toFixed(1),sz=(2+Math.random()*3).toFixed(1),dur=(5+Math.random()*4).toFixed(1);
      h+=`<i style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;background:radial-gradient(circle,${cols[i%4]},transparent);animation-delay:${d}s;animation-duration:${dur}s"></i>`;}
    s.innerHTML=h;})();
  // wspólny kształt lotosu (środek + łąka)
  function lotusPaths(){
    const petal=(ang,len,w,fill)=>{const f=n=>n.toFixed(1);
      return `<path d="M0,0 C ${f(-w*0.9)},${f(-len*0.3)} ${f(-w)},${f(-len*0.66)} ${f(-w*0.34)},${f(-len*0.9)} C ${f(-w*0.12)},${f(-len*0.99)} ${f(w*0.12)},${f(-len*0.99)} ${f(w*0.34)},${f(-len*0.9)} C ${f(w)},${f(-len*0.66)} ${f(w*0.9)},${f(-len*0.3)} 0,0 Z" transform="rotate(${ang})" fill="${fill}" stroke="rgba(255,255,255,.38)" stroke-width="1"/>`;};
    let g='<g transform="translate(100,168)">';
    [-84,-63,-42,-21,0,21,42,63,84].forEach(a=>g+=petal(a,130,30,'url(#lotOut)'));
    [-56,-34,-11,11,34,56].forEach(a=>g+=petal(a,106,27,'url(#lotMid)'));
    [-34,-11,11,34].forEach(a=>g+=petal(a,80,22,'url(#lotIn)'));
    let st='';for(let i=0;i<11;i++){const a=(-50+i*10)*Math.PI/180;st+=`<circle cx="${(Math.sin(a)*12).toFixed(1)}" cy="${(-15-Math.cos(a)*3).toFixed(1)}" r="1.5" fill="#e7b24f"/>`;}
    g+=`<ellipse cx="0" cy="-9" rx="12" ry="8.5" fill="url(#lotSeed)"/>${st}</g>`;return g;}
  (function(){const bs=document.getElementById('bloomSvg');if(bs)bs.innerHTML=lotusPaths();})();

  /* ---------- ogród czasu pracy (kwiat co 30 min) ---------- */
  const GARDEN_KEY='spa_garden',GARDEN_VER='wel1';let garden;try{garden=JSON.parse(localStorage.getItem(GARDEN_KEY)||'null');}catch(e){garden=null;}
  if(!garden||typeof garden!=='object'||garden.v!==GARDEN_VER){
    garden={v:GARDEN_VER,count:3,flowers:[{h:0,s:1.05,r:-6},{h:38,s:0.9,r:9},{h:-26,s:1.0,r:2}]};
    try{localStorage.setItem(GARDEN_KEY,JSON.stringify(garden));}catch(e){}}
  if(!Array.isArray(garden.flowers))garden.flowers=[];if(typeof garden.count!=='number')garden.count=garden.flowers.length;
  function saveGarden(){try{localStorage.setItem(GARDEN_KEY,JSON.stringify(garden));}catch(e){}}
  /* licznik czasu pracy — ZAPISYWANY, przetrwa odświeżenie strony */
  const WORK_KEY='spa_worksec',WORK_SEC=600;/* 10 min na kwiat */
  let workSec=0;try{const s=parseInt(localStorage.getItem(WORK_KEY)||'0',10);if(!isNaN(s)&&s>0&&s<WORK_SEC)workSec=s;}catch(e){workSec=0;}
  function saveWorkSec(){try{localStorage.setItem(WORK_KEY,String(workSec));}catch(e){}}
  const meadowEl=document.getElementById('meadow');
  function flowerEl(v,isNew){const d=document.createElement('div');d.className='mf'+(isNew?' new':'');
    d.style.width=Math.round(46*(v.s||1))+'px';
    d.innerHTML=`<svg viewBox="0 0 200 180" style="width:100%;height:auto;filter:hue-rotate(${v.h||0}deg) saturate(1.05);transform:rotate(${v.r||0}deg)">${lotusPaths()}</svg>`;return d;}
  function updCount(){let c=document.getElementById('mcount');if(!c){c=document.createElement('div');c.id='mcount';c.className='mcount';document.body.appendChild(c);}
    const left=Math.max(1,Math.ceil((WORK_SEC-workSec)/60));
    c.textContent='🪷 Ogród Maliwan · '+garden.count+'  🌱 '+left+' min';c.style.display='';}
  function renderMeadow(){if(meadowEl){meadowEl.innerHTML='';garden.flowers.forEach(v=>meadowEl.appendChild(flowerEl(v,false)));}updCount();}
  function harvestFlower(){const v={h:Math.round(Math.random()*110-30),s:+(0.8+Math.random()*0.5).toFixed(2),r:Math.round(Math.random()*24-12)};
    garden.count++;garden.flowers.push(v);if(garden.flowers.length>90)garden.flowers=garden.flowers.slice(-90);saveGarden();
    if(meadowEl)meadowEl.appendChild(flowerEl(v,true));updCount();
    toast(`🌸 +10 min pracy — nowy kwiat w ogrodzie! (razem: ${garden.count})`);}
  renderMeadow();
  /* środkowy kwiat = licznik pracy; postęp jest zapisywany, więc przeżywa odświeżenie */
  const centerBloom=document.querySelector('.bloom');
  function setCenterBloom(p){if(!centerBloom)return;const e=1-Math.pow(1-p,2);
    centerBloom.style.transform=`translateY(${((1-e)*10).toFixed(1)}px) scale(${(0.05+0.95*e).toFixed(3)})`;
    centerBloom.style.opacity=(Math.min(1,p*10)*0.92).toFixed(2);}
  setCenterBloom(workSec/WORK_SEC);
  setInterval(()=>{if(document.hidden)return;
    workSec++;setCenterBloom(Math.min(1,workSec/WORK_SEC));
    if(workSec%10===0)saveWorkSec();      // zapis postępu co 10 s
    if(workSec%30===0)updCount();          // odświeżenie licznika minut
    if(workSec>=WORK_SEC){workSec=0;saveWorkSec();harvestFlower();setCenterBloom(0);}
  },1000);
  window.addEventListener('beforeunload',saveWorkSec);
  // przypomnienie o kopii zapasowej (gdy są dane, a kopii nie robiono >10 dni)
  setTimeout(()=>{const lb=localStorage.getItem(LB_KEY);const hasAny=Object.keys(data).length>0;
    if(hasAny){const old=!lb||((Date.now()-new Date(lb).getTime())/86400000>10);if(old)toast(L[lang].bkpRemind);}},1600);
</script>
</body>
</html>
